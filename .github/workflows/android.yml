name: Build BlazeMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle --no-daemon assembleDebug
          elif [ -f "BlazeMusicAndroid/settings.gradle.kts" ]; then
            gradle --no-daemon -p BlazeMusicAndroid assembleDebug
          else
            echo "Projet Android introuvable"
            find . -maxdepth 3 -type f -name "settings.gradle.kts"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlazeMusic-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
